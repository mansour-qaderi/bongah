apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    def findFolder = { List<String> paths ->
        paths.collect { file(it) }.find { it.exists() }
    }

    def codegenCandidate = findFolder([
        "../../node_modules/@react-native/codegen",
        "../../../../node_modules/@react-native/codegen",
        "../../../../node_modules/.pnpm/node_modules/@react-native/codegen"
    ])
    if (codegenCandidate != null) {
        codegenDir = codegenCandidate
    }

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * APP SIZE. The first release APK (everything for 4 CPU types in one file) was 187 MB: 171 MB of it was native
 * libraries (Mapbox alone is 13-21 MB per CPU type), repeated for armeabi-v7a, arm64-v8a, x86 and x86_64. Fonts and
 * images are under 1 MB together. So the size is decided by three things below, in this order of effect:
 *
 *  1. One APK per CPU type (arm64-v8a, armeabi-v7a), no universal APK, no x86 / x86_64 (those are emulators and a few
 *     Chromebooks). A phone needs only its own CPU's libraries. Only for release builds: a debug build keeps every
 *     type so it runs on an emulator. (A Play bundle - `bundleRelease` - is split per device by Play itself.)
 *  2. Native libraries stored compressed inside the APK (`useLegacyPackaging`). The default stores them raw so they can
 *     be mapped straight from the file, which doubles their size in the download. Measured on the 187 MB APK: the
 *     arm64 libraries are 44.6 MB raw and 16.3 MB compressed. The price: Android unpacks them on install, so the app
 *     takes about 45 MB more space on the phone, and the first start after install is a little slower.
 *  3. R8 (shrinks and obfuscates the Java / Kotlin code) and resource shrinking.
 *
 * Switch R8 off for one build with `-Pbongah.minify=false` if a release build misbehaves (it is the one setting here
 * that can change what the app does, not just how big it is); the keep rules live in proguard-rules.pro.
 */
def enableProguardInReleaseBuilds = (findProperty('bongah.minify') ?: 'true').toBoolean()
def releaseBuild = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.bongahmobile"
    defaultConfig {
        applicationId "com.bongahmobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 20104
        versionName "2.1.4"
    }
    splits {
        abi {
            enable releaseBuild
            reset()
            include "arm64-v8a", "armeabi-v7a"
            universalApk false
        }
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
