buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
}

plugins {
    id("com.facebook.react.rootproject")
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // The Mapbox Maps SDK (used through @rnmapbox/maps). Mapbox no longer asks for a download token here.
        maven { url 'https://api.mapbox.com/downloads/v2/releases/maven' }
    }
}
